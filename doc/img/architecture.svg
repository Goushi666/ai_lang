<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="appGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="platGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="commGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="percGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43e97b"/><stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/></filter>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8899aa"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8899aa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">系统四层架构图</text>
  <line x1="250" y1="50" x2="650" y2="50" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ===== 应用层 ===== -->
  <rect x="40" y="70" width="820" height="110" rx="10" fill="url(#appGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="70" y="100" font-size="18" font-weight="bold" fill="#fff">应用层 Application Layer</text>
  <text x="70" y="122" font-size="13" fill="rgba(255,255,255,0.85)">Vue 3 + Vite + Element Plus + ECharts + Pinia</text>

  <!-- App layer items -->
  <rect x="70" y="138" width="110" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="125" y="158" text-anchor="middle" font-size="12" fill="#fff">环境监测仪表盘</text>
  <rect x="195" y="138" width="90" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="240" y="158" text-anchor="middle" font-size="12" fill="#fff">告警中心</text>
  <rect x="300" y="138" width="90" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="345" y="158" text-anchor="middle" font-size="12" fill="#fff">视频巡检</text>
  <rect x="405" y="138" width="90" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#fff">智能助手</text>
  <rect x="510" y="138" width="90" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="555" y="158" text-anchor="middle" font-size="12" fill="#fff">车辆遥控</text>
  <rect x="615" y="138" width="90" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="660" y="158" text-anchor="middle" font-size="12" fill="#fff">系统设置</text>

  <!-- Arrow down -->
  <line x1="450" y1="185" x2="450" y2="215" stroke="#8899aa" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="465" y="205" font-size="11" fill="#8899aa">REST / WebSocket / SSE</text>

  <!-- ===== 平台层 ===== -->
  <rect x="40" y="220" width="820" height="130" rx="10" fill="url(#platGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="70" y="250" font-size="18" font-weight="bold" fill="#fff">平台层 Platform Layer</text>
  <text x="70" y="272" font-size="13" fill="rgba(255,255,255,0.85)">FastAPI + SQLAlchemy + Pydantic</text>

  <rect x="70" y="286" width="140" height="50" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="140" y="305" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">传感器数据服务</text>
  <text x="140" y="324" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">采集 · 存储 · 分发</text>

  <rect x="225" y="286" width="130" height="50" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="290" y="305" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">告警管理服务</text>
  <text x="290" y="324" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">多级告警 · 实时推送</text>

  <rect x="370" y="286" width="130" height="50" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="435" y="305" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">智能 Agent 服务</text>
  <text x="435" y="324" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">LLM · RAG · FC</text>

  <rect x="515" y="286" width="130" height="50" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="580" y="305" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">车辆控制服务</text>
  <text x="580" y="324" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">REST → MQTT 指令</text>

  <rect x="660" y="286" width="130" height="50" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="725" y="305" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">知识库服务</text>
  <text x="725" y="324" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">SQLite FTS5 · 文档检索</text>

  <!-- Arrow down -->
  <line x1="450" y1="355" x2="450" y2="385" stroke="#8899aa" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="465" y="375" font-size="11" fill="#8899aa">MQTT / HTTP</text>

  <!-- ===== 通信层 ===== -->
  <rect x="40" y="390" width="820" height="85" rx="10" fill="url(#commGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="70" y="420" font-size="18" font-weight="bold" fill="#2c3e50">通信层 Communication Layer</text>

  <rect x="70" y="435" width="160" height="30" rx="6" fill="rgba(255,255,255,0.5)"/>
  <text x="150" y="455" text-anchor="middle" font-size="13" fill="#1a5276">MQTT (Mosquitto/IoT Core)</text>

  <rect x="250" y="435" width="120" height="30" rx="6" fill="rgba(255,255,255,0.5)"/>
  <text x="310" y="455" text-anchor="middle" font-size="13" fill="#1a5276">WebSocket</text>

  <rect x="390" y="435" width="110" height="30" rx="6" fill="rgba(255,255,255,0.5)"/>
  <text x="445" y="455" text-anchor="middle" font-size="13" fill="#1a5276">HLS / MJPEG</text>

  <rect x="520" y="435" width="120" height="30" rx="6" fill="rgba(255,255,255,0.5)"/>
  <text x="580" y="455" text-anchor="middle" font-size="13" fill="#1a5276">REST API</text>

  <rect x="660" y="435" width="100" height="30" rx="6" fill="rgba(255,255,255,0.5)"/>
  <text x="710" y="455" text-anchor="middle" font-size="13" fill="#1a5276">SSE 流式</text>

  <!-- Arrow down -->
  <line x1="450" y1="480" x2="450" y2="510" stroke="#8899aa" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="465" y="500" font-size="11" fill="#8899aa">GPIO / I2C / PWM</text>

  <!-- ===== 感知层 ===== -->
  <rect x="40" y="515" width="820" height="90" rx="10" fill="url(#percGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="70" y="545" font-size="18" font-weight="bold" fill="#1a5c2a">感知层 Perception Layer</text>
  <text x="70" y="567" font-size="13" fill="rgba(0,0,0,0.55)">树莓派 4B 核心控制器</text>

  <rect x="290" y="530" width="135" height="30" rx="6" fill="rgba(255,255,255,0.55)"/>
  <text x="357" y="550" text-anchor="middle" font-size="12" fill="#1a5c2a">DHT11/22 温湿度</text>

  <rect x="440" y="530" width="110" height="30" rx="6" fill="rgba(255,255,255,0.55)"/>
  <text x="495" y="550" text-anchor="middle" font-size="12" fill="#1a5c2a">BH1750 光照</text>

  <rect x="565" y="530" width="110" height="30" rx="6" fill="rgba(255,255,255,0.55)"/>
  <text x="620" y="550" text-anchor="middle" font-size="12" fill="#1a5c2a">L298N 电机驱动</text>

  <rect x="690" y="530" width="130" height="30" rx="6" fill="rgba(255,255,255,0.55)"/>
  <text x="755" y="550" text-anchor="middle" font-size="12" fill="#1a5c2a">PCA9685 舵机控制</text>

  <rect x="290" y="568" width="110" height="30" rx="6" fill="rgba(255,255,255,0.55)"/>
  <text x="345" y="588" text-anchor="middle" font-size="12" fill="#1a5c2a">USB 摄像头</text>

  <rect x="440" y="568" width="160" height="30" rx="6" fill="rgba(255,255,255,0.55)"/>
  <text x="520" y="588" text-anchor="middle" font-size="12" fill="#1a5c2a">MJPEG 视频流服务</text>

  <rect x="615" y="568" width="140" height="30" rx="6" fill="rgba(255,255,255,0.55)"/>
  <text x="685" y="588" text-anchor="middle" font-size="12" fill="#1a5c2a">OpenCV 循迹模块</text>
</svg>
