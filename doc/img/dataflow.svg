<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/></marker>
    <marker id="arrMqtt" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e67e22"/></marker>
    <marker id="arrWs" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3f51b5"/></marker>
    <marker id="arrHttp" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">数据流与通信示意图</text>
  <line x1="280" y1="47" x2="620" y2="47" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Raspberry Pi -->
  <rect x="30" y="85" width="165" height="280" rx="12" fill="#fff" stroke="#e67e22" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="30" y="85" width="165" height="40" rx="12" fill="#e67e22"/>
  <rect x="30" y="113" width="165" height="12" fill="#e67e22"/>
  <text x="112" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">树莓派 4B</text>
  <text x="112" y="145" text-anchor="middle" font-size="11" fill="#666">传感器采集 / 电机控制</text>
  <text x="112" y="162" text-anchor="middle" font-size="11" fill="#666">视频流服务</text>

  <rect x="45" y="180" width="135" height="30" rx="5" fill="#fff3e0"/>
  <text x="112" y="199" text-anchor="middle" font-size="11" fill="#e67e22">DHT22 · BH1750</text>
  <rect x="45" y="218" width="135" height="30" rx="5" fill="#fff3e0"/>
  <text x="112" y="237" text-anchor="middle" font-size="11" fill="#e67e22">L298N · PCA9685</text>
  <rect x="45" y="256" width="135" height="30" rx="5" fill="#fff3e0"/>
  <text x="112" y="275" text-anchor="middle" font-size="11" fill="#e67e22">USB 摄像头</text>
  <rect x="45" y="294" width="135" height="30" rx="5" fill="#fff3e0"/>
  <text x="112" y="313" text-anchor="middle" font-size="11" fill="#e67e22">Python 主控程序</text>

  <!-- MQTT Broker -->
  <rect x="320" y="85" width="140" height="50" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">MQTT Broker</text>
  <text x="390" y="125" text-anchor="middle" font-size="10" fill="#666">IoT Core / Mosquitto</text>

  <!-- Backend -->
  <rect x="320" y="175" width="140" height="190" rx="10" fill="#fff" stroke="#3f51b5" stroke-width="2" filter="url(#sh)"/>
  <rect x="320" y="175" width="140" height="36" rx="10" fill="#3f51b5"/>
  <rect x="320" y="200" width="140" height="11" fill="#3f51b5"/>
  <text x="390" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">FastAPI 后端</text>

  <text x="390" y="228" text-anchor="middle" font-size="10" fill="#666">数据持久化</text>
  <text x="390" y="244" text-anchor="middle" font-size="10" fill="#666">告警判定</text>
  <text x="390" y="260" text-anchor="middle" font-size="10" fill="#666">Agent 推理</text>
  <text x="390" y="276" text-anchor="middle" font-size="10" fill="#666">RAG 检索</text>
  <text x="390" y="292" text-anchor="middle" font-size="10" fill="#666">WebSocket 广播</text>
  <text x="390" y="308" text-anchor="middle" font-size="10" fill="#666">JWT 鉴权</text>
  <text x="390" y="332" text-anchor="middle" font-size="10" fill="#3f51b5">SQLite / MySQL</text>
  <text x="390" y="350" text-anchor="middle" font-size="10" fill="#3f51b5">SQLite FTS5 知识库</text>

  <!-- Frontend -->
  <rect x="585" y="140" width="280" height="195" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2" filter="url(#sh)"/>
  <rect x="585" y="140" width="280" height="36" rx="10" fill="#2e7d32"/>
  <rect x="585" y="165" width="280" height="11" fill="#2e7d32"/>
  <text x="725" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Vue 3 前端 SPA</text>

  <rect x="600" y="190" width="120" height="26" rx="5" fill="#f1f8e9"/>
  <text x="660" y="208" text-anchor="middle" font-size="10" fill="#2e7d32">仪表盘</text>
  <rect x="730" y="190" width="120" height="26" rx="5" fill="#f1f8e9"/>
  <text x="790" y="208" text-anchor="middle" font-size="10" fill="#2e7d32">告警中心</text>
  <rect x="600" y="224" width="120" height="26" rx="5" fill="#f1f8e9"/>
  <text x="660" y="242" text-anchor="middle" font-size="10" fill="#2e7d32">视频巡检+遥控</text>
  <rect x="730" y="224" width="120" height="26" rx="5" fill="#f1f8e9"/>
  <text x="790" y="242" text-anchor="middle" font-size="10" fill="#2e7d32">智能助手</text>
  <rect x="600" y="258" width="120" height="26" rx="5" fill="#f1f8e9"/>
  <text x="660" y="276" text-anchor="middle" font-size="10" fill="#2e7d32">EmbodiedChat</text>
  <rect x="730" y="258" width="120" height="26" rx="5" fill="#f1f8e9"/>
  <text x="790" y="276" text-anchor="middle" font-size="10" fill="#2e7d32">系统设置</text>

  <!-- MQTT line: RPi → MQTT Broker -->
  <line x1="195" y1="100" x2="318" y2="100" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrMqtt)"/>
  <text x="235" y="92" text-anchor="middle" font-size="9" fill="#e67e22" font-weight="bold">传感器 JSON</text>
  <text x="235" y="118" text-anchor="middle" font-size="8" fill="#999">QoS 0 (上报)</text>

  <!-- MQTT line: MQTT Broker → Backend (subscribe) -->
  <line x1="320" y1="120" x2="320" y2="155" stroke="#e67e22" stroke-width="2"/>
  <line x1="320" y1="155" x2="318" y2="155" stroke="#e67e22" stroke-width="2"/>
  <text x="300" y="143" font-size="9" fill="#e67e22" font-weight="bold">订阅</text>

  <!-- MQTT line: Backend → MQTT Broker (control commands) -->
  <line x1="460" y1="170" x2="460" y2="108" stroke="#e67e22" stroke-width="2" marker-end="url(#arrMqtt)"/>
  <text x="475" y="140" font-size="9" fill="#e67e22" font-weight="bold">车控/机械臂</text>
  <text x="475" y="152" font-size="8" fill="#999">QoS 1 (下发)</text>

  <!-- MQTT Broker → RPi (control commands) -->
  <line x1="388" y1="135" x2="195" y2="135" stroke="#e67e22" stroke-width="2" marker-end="url(#arrMqtt)"/>
  <text x="290" y="148" font-size="9" fill="#e67e22" font-weight="bold">car/control, arm/control</text>

  <!-- REST API: Frontend → Backend -->
  <line x1="585" y1="205" x2="462" y2="205" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrHttp)"/>
  <text x="523" y="198" font-size="9" fill="#2e7d32" font-weight="bold">REST API</text>

  <!-- WebSocket: Backend → Frontend -->
  <line x1="470" y1="230" x2="583" y2="230" stroke="#3f51b5" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrWs)"/>
  <text x="527" y="238" font-size="9" fill="#3f51b5" font-weight="bold">WebSocket 推送</text>

  <!-- SSE: Backend → Frontend -->
  <line x1="470" y1="260" x2="583" y2="255" stroke="#7c4dff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrWs)"/>
  <text x="527" y="270" font-size="9" fill="#7c4dff" font-weight="bold">SSE 流式</text>

  <!-- Video: RPi → Frontend (direct) -->
  <path d="M195,280 Q380,290 583,275" fill="none" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrMqtt)"/>
  <text x="370" y="304" text-anchor="middle" font-size="9" fill="#e67e22" font-weight="bold">MJPEG / HLS 直连拉流（不经后端）</text>

  <!-- LLM API -->
  <rect x="585" y="85" width="280" height="42" rx="10" fill="#fff" stroke="#be2edd" stroke-width="2" filter="url(#sh)"/>
  <text x="725" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#be2edd">LLM API (外部)</text>
  <text x="725" y="119" text-anchor="middle" font-size="10" fill="#666">Function Calling · Streaming</text>
  <line x1="585" y1="106" x2="462" y2="220" stroke="#be2edd" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="520" y="175" font-size="9" fill="#be2edd" transform="rotate(-45,520,175)">Agent 推理请求</text>

  <!-- DB -->
  <rect x="320" y="372" width="140" height="22" rx="5" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="390" y="387" text-anchor="middle" font-size="10" fill="#6c757d">数据库 / 知识库</text>
  <line x1="390" y1="365" x2="390" y2="370" stroke="#adb5bd" stroke-width="1.5"/>
</svg>
